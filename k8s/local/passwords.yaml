apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tak-runtime-password
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tak-database-runtime
spec:
  refreshPolicy: CreatedOnce
  target:
    name: tak-database-runtime
    creationPolicy: Orphan
    immutable: true
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: tak_runtime
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tak-runtime-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tak-store-password
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tak-store-passwords
spec:
  refreshPolicy: CreatedOnce
  target:
    name: tak-store-passwords
    creationPolicy: Orphan
    immutable: true
    template:
      data:
        cot-password: "{{ .password }}"
        https-password: "{{ .password }}"
        trust-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tak-store-password
