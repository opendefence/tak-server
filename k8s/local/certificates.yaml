apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tak-cot-identity
spec:
  secretName: tak-cot-identity # pragma: allowlist secret
  commonName: tak.localtest.me
  dnsNames: [tak.localtest.me]
  privateKey: {algorithm: RSA, size: 2048}
  usages: [digital signature, key encipherment, server auth]
  keystores:
    jks:
      create: true
      passwordSecretRef: {name: tak-store-passwords, key: cot-password}
  issuerRef: {kind: ClusterIssuer, name: public-issuer}
---
