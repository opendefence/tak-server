apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tak-database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:15.19-3.6.4-202608311017-standard-trixie@sha256:5c28ebba3202ff027da64bafeabb2a48983cbfec2f74ce1b36c9e635f35da763
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: cot
      owner: tak_schema
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
  managed:
    roles:
      - name: tak_runtime
        ensure: present
        login: true
        passwordSecret:
          name: tak-database-runtime
