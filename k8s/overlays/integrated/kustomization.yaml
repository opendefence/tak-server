apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: integration-tak
resources:
  - ../../base
patches:
  - target: {kind: StatefulSet, name: tak-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/2/volumeMounts/-
        value: {name: integration-admin, mountPath: /identities/integration-admin, readOnly: true}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: integration-admin
          secret: {secretName: tak-integration-admin, optional: true, items: [{key: tls.crt, path: tls.crt}]}
  - target: {kind: NetworkPolicy, name: tak-server}
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - podSelector:
                matchLabels:
                  app: integration-tak-operator
          ports:
            - {protocol: TCP, port: 47100, endPort: 47120}
            - {protocol: TCP, port: 47500, endPort: 47520}
            - {protocol: TCP, port: 10800, endPort: 10820}
