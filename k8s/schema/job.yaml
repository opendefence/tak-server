apiVersion: batch/v1
kind: Job
metadata:
  name: tak-schema-5-8-92
  labels:
    app.kubernetes.io/name: tak-server
    app.kubernetes.io/component: schema
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tak-server
        app.kubernetes.io/component: schema
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: schema
          image: tak-server:5.8.92
          command: [java]
          args:
            - -cp
            - /opt/tak/db-utils/SchemaManager.jar:/opt/tak/lib/pvarki-launcher.jar
            - org.opendefence.tak.SchemaUpgrade
          env:
            - name: POSTGRES_ADDRESS
              valueFrom:
                secretKeyRef: {name: tak-database-app, key: host}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: tak-database-app, key: dbname}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: tak-database-app, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: tak-database-app, key: password}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
