apiVersion: batch/v1
kind: Job
metadata:
  name: tak-schema-5-8-84
  labels:
    app.kubernetes.io/name: tak-server
    app.kubernetes.io/component: schema
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tak-server
        app.kubernetes.io/component: schema
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: schema
          image: tak-server:5.8.84
          command: [/bin/bash, -ec]
          args:
            - >-
              exec java -jar /opt/tak/db-utils/SchemaManager.jar
              -url "jdbc:postgresql://${POSTGRES_ADDRESS}:5432/${POSTGRES_DB}"
              -user "${POSTGRES_USER}" -password "${POSTGRES_PASSWORD}" upgrade
          envFrom:
            - configMapRef: {name: tak-schema-settings}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: tak-database-migration, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: tak-database-migration, key: password}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
