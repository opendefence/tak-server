apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tak-server
  labels:
    app.kubernetes.io/name: tak-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tak-server
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8089}
        - {protocol: TCP, port: 8090}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9000, endPort: 9002}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tak-server
      ports:
        - {protocol: TCP, port: 47100, endPort: 47120}
        - {protocol: TCP, port: 47500, endPort: 47520}
        - {protocol: TCP, port: 10800, endPort: 10820}
