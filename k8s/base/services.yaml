apiVersion: v1
kind: Service
metadata:
  name: tak-ignite
  labels:
    app.kubernetes.io/name: tak-server
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: tak-server
    app.kubernetes.io/component: server
  ports:
    - {name: discovery, port: 47500, targetPort: 47500}
---
apiVersion: v1
kind: Service
metadata:
  name: tak-server
  labels:
    app.kubernetes.io/name: tak-server
spec:
  selector:
    app.kubernetes.io/name: tak-server
    app.kubernetes.io/component: server
  ports:
    - {name: cot, port: 8089, targetPort: 8089}
    - {name: cot-noarchive, port: 8090, targetPort: 8090}
    - {name: https, port: 8443, targetPort: 8443}
    - {name: federation-v1, port: 9000, targetPort: 9000}
    - {name: federation-v2, port: 9001, targetPort: 9001}
    - {name: federation-token, port: 9002, targetPort: 9002}
