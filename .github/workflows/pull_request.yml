on:
    pull_request:
    workflow_dispatch:

# Remember to change TAK_RELEASE also in push_to_main.yml
env:
  TAK_RELEASE: 5.8-RELEASE-92

jobs:
  checks:
    runs-on: arc-runner-set
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Prepare env file for hooks
        run: cp takserver.env.example takserver.env
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check TAK release sync
        run: uv run --frozen -m unittest tests.test_workflow_release -v
      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          SKIP: no-commit-to-branch
      - name: Validate bumpversion
        uses: pvarki/config-ci-library/.github/actions/validate-bumpversion@1786399bf62c2b691f1e8fb9dcfc7a0be72a2846


  native_validations:
    needs: [checks, publish_pr_image]
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      (needs.publish_pr_image.result == 'success' || needs.publish_pr_image.result == 'skipped')
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: read
      pull-requests: write
      checks: write
    steps:
      - name: Install git-lfs
        run: sudo apt-get update && sudo apt-get install -y git-lfs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Log in to GHCR
        if: needs.publish_pr_image.result == 'success'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published candidate
        if: needs.publish_pr_image.result == 'success'
        env:
          TAK_PUBLISHED_IMAGE: ${{ needs.publish_pr_image.outputs.tak-image }}
        run: |
          docker pull "$TAK_PUBLISHED_IMAGE"
          docker image tag "$TAK_PUBLISHED_IMAGE" localhost/tak-server:local
      - name: Build candidate image
        if: needs.publish_pr_image.result == 'skipped'
        run: docker buildx build --load --build-arg TAK_RELEASE="$TAK_RELEASE" -t localhost/tak-server:local .
      - name: Record candidate image
        run: |
          tak_image_id=$(docker image inspect --format '{{.Id}}' localhost/tak-server:local)
          echo "TAK_TEST_IMAGE=$tak_image_id" >> "$GITHUB_ENV"
      - name: Test configuration and launchers
        run: |
          docker run --rm --pull=never --network none -v "$PWD:/workspace:ro" \
            --entrypoint /usr/bin/python3 "$TAK_TEST_IMAGE" \
            -B -m unittest discover -s /workspace/tests -v
      - name: Verify strict agent installation and fail-closed startup
        run: sh tests/test-strict-agent.sh "$TAK_TEST_IMAGE"
      - name: Verify vendor launcher and retired helpers
        run: docker run --rm --pull=never -v "$PWD:/workspace:ro" --entrypoint /bin/bash "$TAK_TEST_IMAGE" /workspace/tests/test-server-launcher.sh
      - name: Test federation truststore initialization
        run: |
          docker run --rm --pull=never --network none -v "$PWD:/workspace:ro" \
            --entrypoint /bin/bash "$TAK_TEST_IMAGE" /workspace/tests/test-fed-truststore.sh
      - name: Test HTTPS keystore selection
        run: |
          docker run --rm --pull=never --network none -v "$PWD:/workspace:ro" \
            --entrypoint /bin/bash "$TAK_TEST_IMAGE" /workspace/tests/test-api-keystore.sh
      - name: Validate native standalone deployment
        run: |
          mise exec -- task --yes up
          test "$(docker image inspect --format '{{.Id}}' localhost/tak-server:local)" = "$TAK_TEST_IMAGE"
      - name: Build standalone Zarf packages
        if: needs.publish_pr_image.result == 'success'
        env:
          TAK_IMAGE: ${{ needs.publish_pr_image.outputs.tak-image }}
        run: |
          set -euo pipefail
          mkdir -p outputs/zarf/standalone
          for arch in amd64 arm64; do
            zarf package create . --architecture "$arch" --flavor standalone \
              --set "TAK_IMAGE=$TAK_IMAGE" --confirm --output outputs/zarf/standalone
          done
      - name: Upload standalone Zarf packages
        if: needs.publish_pr_image.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tak-server-standalone
          path: outputs/zarf/standalone/zarf-package-*.tar.zst
          if-no-files-found: error
          compression-level: 0
      - name: Show native workload status on failure
        if: failure()
        run: |
          export KUBECONFIG="$PWD/outputs/local/kubeconfig"
          mise exec -- task --yes status
          kubectl --context kind-tak-server-local -n tak-server describe job/tak-schema-5-8-92 || true
          for pod in $(kubectl --context kind-tak-server-local -n tak-server get pods -l batch.kubernetes.io/job-name=tak-schema-5-8-92 -o name); do
            kubectl --context kind-tak-server-local -n tak-server describe "$pod" || true
            kubectl --context kind-tak-server-local -n tak-server logs "$pod" -c schema || true
          done
      - name: Clean up disposable cluster
        if: always()
        run: mise exec -- task --yes down

  publish_pr_image:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [checks]
    runs-on: arc-runner-set
    env:
      PR_IMAGE_TAG: pr-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      tak-image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install git-lfs
        run: sudo apt-get update && sudo apt-get install -y git-lfs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
      - name: Publish PR image
        id: publish
        uses: pvarki/config-ci-library/.github/actions/publish-image@1786399bf62c2b691f1e8fb9dcfc7a0be72a2846
        with:
          product: tak
          component: server
          target: run
          platforms: linux/amd64,linux/arm64
          extra-tag: ${{ env.PR_IMAGE_TAG }}
          build-args: |
            TAK_RELEASE=${{ env.TAK_RELEASE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve published image
        id: image
        env:
          IMAGE: ghcr.io/${{ steps.publish.outputs.image-name }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$PR_IMAGE_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
