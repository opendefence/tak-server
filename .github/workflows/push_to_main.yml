on:
  push:
    branches:
      - main

# Remember to change TAK_RELEASE also in pull_request.yml
env:
  TAK_RELEASE: 5.8-RELEASE-84

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Prepare env file for hooks
        run: cp takserver.env.example takserver.env
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check TAK release sync
        run: uv run --frozen -m unittest tests.test_workflow_release -v
      - name: Run prek
        uses: j178/prek-action@6dd76cd3f10a318f0fb0b7743a9651fda964a551 # v2
        env:
          SKIP: no-commit-to-branch

  build_and_publish:
    if: vars.TAK_PUBLISH_ENABLED == 'true'
    runs-on: arc-runner-set
    needs: [checks]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install git-lfs
        run: sudo apt-get update && sudo apt-get install -y git-lfs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          lfs: true
      - name: Publish image
        uses: pvarki/config-ci-library/.github/actions/publish-image@1786399bf62c2b691f1e8fb9dcfc7a0be72a2846
        with:
          product: tak
          component: server
          target: run
          extra-tag: ${{ env.TAK_RELEASE }}
          build-args: |
            TAK_RELEASE=${{ env.TAK_RELEASE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
