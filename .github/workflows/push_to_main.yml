on:
  push:
    branches:
      - main

# Remember to change TAK_RELEASE also in pull_request.yml
env:
  TAK_RELEASE: 5.8-RELEASE-92

concurrency:
  group: tak-server-publish
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check TAK release sync
        run: uv run --frozen -m unittest tests.test_workflow_release -v
      - name: Test strict fingerprint policy and hooks
        run: |
          docker run --rm --network none --cpus 2 --memory 512m \
            --tmpfs /work:rw,size=64m \
            -v "$PWD/extensions/strict-fingerprint:/extension:ro" \
            eclipse-temurin:17-jdk-noble@sha256:fb79620c3f6ee8f1c7530a8dc4fd49e3b410bcef037694ad4858a1553bac4170 \
            sh /extension/test.sh
      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          SKIP: no-commit-to-branch

  build_and_publish:
    runs-on: arc-runner-set
    needs: [checks]
    defaults:
      run:
        shell: bash
    outputs:
      tak-image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Install git-lfs
        run: sudo apt-get update && sudo apt-get install -y git-lfs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: zarf
      - name: Publish image
        id: publish
        uses: pvarki/config-ci-library/.github/actions/publish-image@1786399bf62c2b691f1e8fb9dcfc7a0be72a2846
        with:
          product: tak
          component: server
          target: run
          platforms: linux/amd64,linux/arm64
          extra-tag: ${{ env.TAK_RELEASE }}
          build-args: |
            TAK_RELEASE=${{ env.TAK_RELEASE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve published image for Zarf
        id: image
        env:
          IMAGE: ghcr.io/${{ steps.publish.outputs.image-name }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAK_RELEASE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Test the published image
        env:
          TAK_TEST_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker pull "$TAK_TEST_IMAGE"
          docker run --rm --pull=never --network none -v "$PWD:/workspace:ro" \
            --entrypoint /usr/bin/python3 "$TAK_TEST_IMAGE" \
            -B -m unittest discover -s /workspace/tests -v
          sh tests/test-strict-agent.sh "$TAK_TEST_IMAGE"
          for test in test-server-launcher test-api-keystore; do
            docker run --rm --pull=never -v "$PWD:/workspace:ro" \
              --entrypoint /bin/bash "$TAK_TEST_IMAGE" "/workspace/tests/$test.sh"
          done
      - name: Validate Zarf flavors and report image reference
        env:
          TAK_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          zarf dev lint . --flavor standalone --set "TAK_IMAGE=$TAK_IMAGE"
          zarf dev lint . --flavor integrated --set "TAK_IMAGE=$TAK_IMAGE"
          {
            printf '## Published TAK server image\n\n'
            printf '`%s`\n\n' "$TAK_IMAGE"
            printf 'Use this digest for either Zarf flavor:\n\n```sh\n'
            printf 'zarf package create . --flavor standalone --set TAK_IMAGE=%s\n' "$TAK_IMAGE"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build, sign, and publish Zarf packages
        env:
          TAK_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('.bumpversion.toml', 'rb'))['tool']['bumpversion']['current_version'])")
          version_tag="${version//+/-}"
          # Leave room for the flavor suffix within OCI's 128-character tag limit.
          if [[ ! "$version_tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,116}$ ]]; then
            echo "Missing version or invalid OCI version tag: $version_tag" >&2
            exit 1
          fi
          repository="oci://${TAK_IMAGE%/*}/zarf"
          shopt -s nullglob
          mkdir -p outputs/zarf/standalone
          printf '## Published Zarf packages\n\n' >> "$GITHUB_STEP_SUMMARY"
          for flavor in standalone integrated; do
            for arch in amd64 arm64; do
              build_dir=$(mktemp -d "$RUNNER_TEMP/zarf-build.XXXXXX")
              zarf package create . --architecture "$arch" --flavor "$flavor" \
                --set "TAK_IMAGE=$TAK_IMAGE" --confirm --output "$build_dir"
              packages=("$build_dir"/zarf-package-*.tar.zst)
              if [[ ${#packages[@]} -ne 1 ]]; then
                echo "Expected exactly one Zarf package archive" >&2
                exit 1
              fi
              zarf package sign "${packages[0]}" --keyless --confirm
              zarf package publish "${packages[0]}" "$repository" \
                --tag "$version_tag-$flavor" --confirm
              zarf package publish "${packages[0]}" "$repository" \
                --tag "latest-$flavor" --confirm
              printf -- '- `%s/tak-server:%s-%s` and `latest-%s` (%s)\n' \
                "$repository" "$version_tag" "$flavor" "$flavor" "$arch" >> "$GITHUB_STEP_SUMMARY"
              if [[ "$flavor" == standalone ]]; then
                cp "${packages[0]}" outputs/zarf/standalone/
              fi
              rm -rf "$build_dir"
            done
          done
      - name: Upload standalone Zarf packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tak-server-standalone
          path: outputs/zarf/standalone/zarf-package-*.tar.zst
          if-no-files-found: error
          compression-level: 0
