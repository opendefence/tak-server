on:
  push:
    branches:
      - main

# Remember to change TAK_RELEASE also in pull_request.yml
env:
  TAK_RELEASE: 5.8-RELEASE-92

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Prepare env file for hooks
        run: cp takserver.env.example takserver.env
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check TAK release sync
        run: uv run --frozen -m unittest tests.test_workflow_release -v
      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          SKIP: no-commit-to-branch

  build_and_publish:
    if: vars.TAK_PUBLISH_ENABLED == 'true'
    runs-on: arc-runner-set
    needs: [checks]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install git-lfs
        run: sudo apt-get update && sudo apt-get install -y git-lfs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
      - name: Publish image
        uses: pvarki/config-ci-library/.github/actions/publish-image@1786399bf62c2b691f1e8fb9dcfc7a0be72a2846
        with:
          product: tak
          component: server
          target: run
          extra-tag: ${{ env.TAK_RELEASE }}
          build-args: |
            TAK_RELEASE=${{ env.TAK_RELEASE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
